[project]
name = "research-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.148.0",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-redis>=0.5.2",
    "openai>=3.33.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
